<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>treine.me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Inter:wght@700&family=Mulish:wght@400;700&family=Open+Sans:wght@400&display=swap"

  <body>
    <div class="wrapper">
      <header class="container">
        <div class="logo"><span class="accent">treine.me</span></div>

            <li class="active"><a href="#">Home</a></li>
            <li><a href="#">About</a></li>

        </nav>
      </header>
      <main class="container">
        <div class="hero_text">
          <h1>workouts made <span class="accent">exclusive</span> for you!</h1>

            We create <strong>exclusive and unique workouts</strong> for you.
            Invest in your body and
            <strong>get much more performance</strong> and quality of life.
          </p>
          <button class="btn">&#9742; Start now</button>
        </div>
        <div class="hero_img">
          <img
            src="images/hero-illustration.png"
            alt="Дівчина, що тренується"
            height="516"
            width="520"
          />
        </div>

      <footer class="container">
        <p>send us a message @treine.me</p>
        <div class="dots"></div>
      </footer>
    </div>
